changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🎨 UI / UX
      labels:
        - ui
        - design
    - title: 📝 Documentation
      labels:
        - docs
    - title: 🔧 Maintenance
      labels:
        - chore
        - refactor
    - title: Other Changes
      labels:
        - "*"
