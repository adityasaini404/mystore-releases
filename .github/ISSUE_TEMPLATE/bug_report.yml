name: 🐛 Bug Report
description: Report a bug in the MyStore app
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill this out carefully — it helps us fix faster.

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Found in Profile → About
      placeholder: "e.g. 2.5.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: "e.g. Pixel 7, Redmi Note 12"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Be as specific as possible
      placeholder: |
        1. Open app
        2. Go to X screen
        3. Tap Y button
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: Drag and drop here
    validations:
      required: false
